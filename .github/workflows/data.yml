name: Calendar data

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data
      - name: Check for a new year
        id: changed
        run: |
          if git diff --quiet -- src/data.ts; then
            echo "Calendar data is up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.changed == 'true'
        run: npm run typecheck
      - if: steps.changed.outputs.changed == 'true'
        run: npm test
      - name: Release the new data
        id: release
        if: steps.changed.outputs.changed == 'true'
        run: |
          year="$(node --input-type=module -e "const m = await import('./src/data.ts'); console.log(m.FIRST_YEAR + m.YEARS.length - 1)")"
          version="$(node -p "const [major, minor] = require('./package.json').version.split('.').map(Number); [major, minor + 1, 0].join('.')")"
          npm version "$version" --no-git-tag-version
          node -e "
            const fs = require('node:fs');
            const jsr = JSON.parse(fs.readFileSync('jsr.json', 'utf8'));
            jsr.version = process.argv[1];
            fs.writeFileSync('jsr.json', JSON.stringify(jsr, null, 2) + '\n');
            const log = fs.readFileSync('CHANGELOG.md', 'utf8');
            const at = log.indexOf('\n## ');
            const entry = '\n## ' + process.argv[1] + '\n\n- Production calendar for ' + process.argv[2] + ', checked against isdayoff.ru and xmlcalendar.ru day by day\n';
            fs.writeFileSync('CHANGELOG.md', log.slice(0, at) + entry + log.slice(at));
          " "$version" "$year"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Add production calendar for $year"
          git push origin HEAD:main
          git tag "v$version"
          git push origin "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Start publishing
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main -f tag="${{ steps.release.outputs.tag }}"

