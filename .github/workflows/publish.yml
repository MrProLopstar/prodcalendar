name: Publish

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for a new release, data refreshes the bundled data and releases it if it changed
        type: choice
        options: [patch, minor, major, current, data]
        default: patch
      version:
        description: Exact version instead of a bump, e.g. 1.2.0
        type: string
        required: false
      tag:
        description: Republish an existing tag instead, e.g. v1.2.0
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.tag == '' && inputs.bump != 'data'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: version
        name: Resolve version
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          current="$(node -p "require('./package.json').version")"
          if [ -n "$EXACT" ]; then
            next="$EXACT"
          elif [ "$BUMP" = "current" ]; then
            next="$current"
          else
            next="$(node -e "
              const [major, minor, patch] = process.argv[1].split('.').map(Number);
              const bump = process.argv[2];
              console.log(bump === 'major' ? [major + 1, 0, 0].join('.') : bump === 'minor' ? [major, minor + 1, 0].join('.') : [major, minor, patch + 1].join('.'));
            " "$current" "$BUMP")"
          fi
          if ! echo "$next" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version $next"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$next" > /dev/null; then
            echo "::error::Tag v$next already exists"
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('node:fs');
            const jsr = JSON.parse(fs.readFileSync('jsr.json', 'utf8'));
            jsr.version = process.argv[1];
            fs.writeFileSync('jsr.json', JSON.stringify(jsr, null, 2) + '\n');
          " "$VERSION"
          if ! git diff --quiet; then
            git commit -am "Release $VERSION"
            git push origin HEAD:main
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

  data:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.bump == 'data')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data
      - name: Check for a new year
        id: changed
        run: |
          if git diff --quiet -- src/data.ts; then
            echo "Calendar data is up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.changed == 'true'
        run: npm run typecheck
      - if: steps.changed.outputs.changed == 'true'
        run: npm test
      - name: Release the new data
        id: release
        if: steps.changed.outputs.changed == 'true'
        run: |
          year="$(node --input-type=module -e "const m = await import('./src/data.ts'); console.log(m.FIRST_YEAR + m.YEARS.length - 1)")"
          version="$(node -p "const [major, minor] = require('./package.json').version.split('.').map(Number); [major, minor + 1, 0].join('.')")"
          npm version "$version" --no-git-tag-version
          node -e "
            const fs = require('node:fs');
            const jsr = JSON.parse(fs.readFileSync('jsr.json', 'utf8'));
            jsr.version = process.argv[1];
            fs.writeFileSync('jsr.json', JSON.stringify(jsr, null, 2) + '\n');
            const log = fs.readFileSync('CHANGELOG.md', 'utf8');
            const at = log.indexOf('\n## ');
            const entry = '\n## ' + process.argv[1] + '\n\n- Production calendar for ' + process.argv[2] + ', checked against isdayoff.ru and xmlcalendar.ru day by day\n';
            fs.writeFileSync('CHANGELOG.md', log.slice(0, at) + entry + log.slice(at));
          " "$version" "$year"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Add production calendar for $year"
          git push origin HEAD:main
          git tag "v$version"
          git push origin "v$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: [release, data]
    if: ${{ !failure() && !cancelled() && (github.ref_type == 'tag' || inputs.tag != '' || needs.release.outputs.tag != '' || needs.data.outputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      TAG: ${{ (github.ref_type == 'tag' && github.ref_name) || inputs.tag || needs.release.outputs.tag || needs.data.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check versions match the tag
        run: |
          version="${TAG#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          test "$(node -p "require('./jsr.json').version")" = "$version"
      - name: Publish to npm
        run: |
          rm -f ~/.npmrc .npmrc
          unset NODE_AUTH_TOKEN
          npm install -g npm@latest
          npm run build
          if npm view "prodcalendar@${TAG#v}" version > /dev/null 2>&1; then
            echo "Already on npm"
          else
            npm publish --access public --provenance --ignore-scripts
          fi
      - run: npx jsr publish
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@mrprolopstar'
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm run build
          npm pkg set name=@mrprolopstar/prodcalendar
          if npm view "@mrprolopstar/prodcalendar@${TAG#v}" version > /dev/null 2>&1; then
            echo "Already on GitHub Packages"
          else
            npm publish --ignore-scripts
          fi
          git checkout -- package.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          version="${TAG#v}"
          awk -v v="$version" '$0 == "## " v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
